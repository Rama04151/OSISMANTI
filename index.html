<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Maintenance - OSIS SMAN 3 Tebas</title>
    <style>
        /* Palet Warna Biru */
        :root {
            --primary-blue: #007bff; /* Biru cerah */
            --light-bg: #e9f7ff;    /* Latar belakang biru sangat muda */
            --text-color: #333;
            --container-bg: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: var(--light-bg); /* Latar belakang biru muda */
            color: var(--text-color);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-top: 5px solid var(--primary-blue); /* Garis biru di atas */
        }
        h1 {
            color: var(--primary-blue); /* Judul berwarna biru */
            font-size: 2.2em;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.15em;
            line-height: 1.6;
        }
        .contact-info {
            margin-top: 25px;
            padding: 15px;
            background-color: #f0f8ff; /* Warna biru sangat muda untuk kotak kontak */
            border-radius: 8px;
            border: 1px solid #cce5ff;
            display: inline-block;
        }
        .contact-info strong {
            color: var(--primary-blue);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚧 Website Sedang Pemeliharaan 🚧</h1>
        <p>
            Maaf, website OSIS SMAN 3 Tebas sedang menjalani maintenance (pemeliharaan rutin).
        </p>
        <p>
            Kami mohon maaf atas ketidaknyamanan ini. Kami akan segera kembali online.
        </p>
        
        <div class="contact-info">
            <p>
                Silakan hubungi OSIS untuk informasi, pertanyaan, atau urusan mendesak lainnya.
            </p>
            </div>
    </div>
</body>
</html>
